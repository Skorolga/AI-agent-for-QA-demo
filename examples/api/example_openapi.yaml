openapi: 3.0.3
info:
  title: Demo Orders API
  version: 1.0.0
servers:
  - url: https://api.example.test

paths:
  /orders:
    post:
      summary: Create order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request

    get:
      summary: List orders
      operationId: listOrders
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Orders list

  /orders/{orderId}:
    get:
      summary: Get order
      operationId: getOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found
        '404':
          description: Order not found

components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 20

    Order:
      type: object
      required:
        - id
        - productId
        - quantity
      properties:
        id:
          type: string
        productId:
          type: string
        quantity:
          type: integer
